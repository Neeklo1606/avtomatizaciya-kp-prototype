<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Админ-панель — Э1 — Автоматизация КП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEBE6;--surface:#F6F5F1;--card:#FFFFFF;--ink:#121212;--ink-muted:#6A6963;--line:rgba(18,18,18,.10);--yellow:#FFE45C;--sky:#5CC3F7;--sand:#D9CD92;--mint:#9FE3B5;--coral:#FF8A7A;--r-card:18px;--on-accent:#121212;--r-nest:12px;--r-pill:999px;--dur:160ms;--ease:cubic-bezier(.22,.61,.36,1);--side:240px;--rail:64px}
[data-theme=dark]{--bg:#141414;--surface:#1D1D1D;--card:#232323;--ink:#F4F3EF;--ink-muted:#B4B3AC;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Onest,system-ui,sans-serif;font-size:14px;line-height:20px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.hint{font-size:12px;line-height:16px;color:var(--ink-muted);overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:12px;max-width:190px}
.mini.tac{width:64px;text-align:right}
.side{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;flex-direction:column;gap:4px;z-index:20;overflow:auto}
.rail{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);padding:14px 8px;flex-direction:column;align-items:center;gap:6px;z-index:20}
.main{margin:0}
@media(min-width:900px){.rail{display:flex}.main{margin-left:var(--rail)}}
@media(min-width:1180px){.side{display:flex}.rail{display:none}.main{margin-left:var(--side)}}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding:0 8px}
.brand .mark{width:34px;height:34px;border-radius:999px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.brand b{font-size:14px;font-weight:600;display:block;letter-spacing:-.01em}
.grp{margin-bottom:12px}
.grp>span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:0 10px;margin-bottom:4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-nest);text-align:left}
.nv:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nv[aria-current=page]{background:var(--ink);color:var(--bg);font-weight:600}
.nv svg{width:18px;height:18px;flex:0 0 auto}
.nv .sp{flex:1}
.railbtn{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.railbtn svg{width:20px;height:20px}
.railbtn[aria-current=page]{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.li svg{width:18px;height:18px;flex:0 0 auto}
.tblwrap svg,.src svg{width:18px;height:18px}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
.tbrow{display:flex;align-items:center;gap:10px;max-width:1560px;margin:0 auto}
.tbtitle{flex:1;min-width:0}
.tbtitle h1{font-size:19px;line-height:25px;font-weight:600;letter-spacing:-.02em}
.content{padding:14px 16px 90px;max-width:1560px;margin:0 auto}
@media(min-width:1180px){.content{padding:18px 24px 60px}}
.ib{width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);flex:0 0 auto;transition:transform var(--dur) var(--ease)}
.ib svg{width:18px;height:18px}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:15px;height:15px}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,var(--card))}
.ib:active{transform:scale(.95)}
.btn{border-radius:var(--r-pill);padding:9px 16px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card);transition:transform var(--dur) var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.wide{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px}
@media(min-width:1180px){.card{padding:16px}}
.nest{background:var(--surface);border-radius:var(--r-nest);padding:11px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.rowsplit{display:flex;gap:12px;align-items:stretch;flex-direction:column}
.rowsplit>*{min-width:0}
@media(min-width:1180px){.rowsplit.row-desk{flex-direction:row}.rowsplit.row-desk>.c-a{flex:1;min-width:0}.rowsplit.row-desk>.c-b{width:470px;flex:0 0 auto}}
.row{display:flex;align-items:center;gap:8px}
.wrapflex{flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head h2{font-size:15px;line-height:20px;font-weight:600;flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 9px;font-size:11px;line-height:15px;font-weight:500;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.c-mint{background:var(--mint);border-color:transparent;color:#121212}
.c-yellow{background:var(--yellow);border-color:transparent;color:#121212}
.c-coral{background:var(--coral);border-color:transparent;color:#121212}
.c-neutral{background:var(--surface);color:var(--ink-muted)}
.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{text-align:left;font-size:11px;line-height:15px;font-weight:600;color:var(--ink-muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.tbl .r{text-align:right}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.tblscroll{overflow:auto;max-height:min(62vh,540px)}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.src{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;background:var(--card)}
.src.bad{border-color:var(--coral);border-width:2px}
.src .fname{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:600}
.stat{border-radius:var(--r-card);padding:14px;background:var(--card);border:1px solid var(--line)}
.accent{border-radius:var(--r-card);padding:14px;color:var(--on-accent);border:0}
.a-yellow{background:var(--yellow)}
.stat .big,.accent .big{font-size:26px;line-height:30px;font-weight:700;letter-spacing:-.02em}
.stat .lbl,.accent .lbl{font-size:11px;line-height:15px;color:var(--ink-muted);margin-top:1px}
.accent .lbl{color:rgba(18,18,18,.7)}
.calcrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.calcrow:last-child{border-bottom:0;font-weight:700;font-size:14px}
.calcrow .hint{font-size:12px}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:11px;line-height:15px;color:var(--ink-muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-nest);padding:9px 11px;outline:none}
.field textarea{min-height:150px;resize:vertical;line-height:20px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:var(--r-card) var(--r-card) 0 0;padding:16px;max-height:88vh;overflow:auto;transform:translateY(102%);transition:transform var(--dur) var(--ease);box-shadow:0 -16px 40px rgba(18,18,18,.2)}
.sheet.open{transform:translateY(0)}
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
@media(min-width:900px){.sheet{left:50%;transform:translate(-50%,102%);width:620px;border-radius:var(--r-card)}.sheet.open{transform:translate(-50%,0)}}
.dlg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
.dlg.open{display:flex}
.notiwrap{position:relative;flex:0 0 auto}
.notibadge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:999px;background:#B35A2A;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:600}
.nit{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:14px;min-height:44px}
.nit:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.nit .sp{flex:1;min-width:0}
.nit b{display:block;font-size:14px;line-height:19px;font-weight:600}
.nit>svg{width:18px;height:18px;flex:0 0 auto;color:var(--ink-muted)}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:85;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:10px 16px;font-size:13px;display:none;align-items:center;gap:12px}
.undo.on{display:flex}
.undo button{color:var(--yellow);font-weight:600;text-decoration:underline}
.dlg .box{background:var(--card);border-radius:var(--r-card);padding:18px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(18,18,18,.25)}
.dlg h3{font-size:16px;line-height:22px;font-weight:600;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:10px 16px;font-size:13px;max-width:92vw;display:none;text-align:center;z-index:80}
.toast.on{display:block}
.sk{background:linear-gradient(90deg,var(--surface) 25%,color-mix(in srgb,var(--ink) 8%,var(--surface)) 37%,var(--surface) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:var(--r-nest)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.sk.h44{height:44px}.sk.h80{height:80px}.sk.h160{height:160px}
.empty{text-align:center;padding:26px 16px;border-radius:var(--r-card);background:var(--card);border:1px dashed var(--line)}
.empty .ic{width:46px;height:46px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.empty .ic svg{width:20px;height:20px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:3px}
.err{border-radius:var(--r-card);background:var(--coral);color:#121212;padding:16px}
.err h3{font-size:15px;font-weight:700;margin-bottom:3px}
.err .btn{margin-top:10px;background:rgba(18,18,18,.86);color:#fff;border-color:transparent}
.lock{max-width:520px;margin:40px auto;text-align:center;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);padding:28px 20px}
.lock .ic{width:58px;height:58px;border-radius:999px;background:var(--yellow);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.lock .ic svg{width:26px;height:26px}
.lock h2{font-size:20px;line-height:26px;font-weight:700;margin-bottom:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 11px;font-size:12px;color:var(--ink-muted)}
.step.on{border-color:transparent;background:var(--ink);color:var(--bg);font-weight:600}
.step.done{border-color:transparent;background:var(--mint);color:#121212;font-weight:600}
.tl{display:flex;flex-direction:column;gap:8px;position:relative}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{display:flex;gap:10px;align-items:flex-start;position:relative}
.tli .pin{width:22px;height:22px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto;z-index:1}
.tli .bd{flex:1;background:var(--surface);border-radius:var(--r-nest);padding:9px 11px}
.tli .bd b{font-size:13px;font-weight:600;display:block}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.var{border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 9px;font-size:11px;background:var(--surface);font-family:ui-monospace,monospace}
.prev{background:var(--surface);border-radius:var(--r-nest);padding:11px;white-space:pre-wrap;font-size:13px;line-height:20px;min-height:120px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-nest);padding:10px 11px;background:var(--card);width:100%;text-align:left}
.li[aria-selected=true]{background:var(--yellow);border-color:transparent;color:#121212}
.li svg{width:18px;height:18px;flex:0 0 auto}
.li b{font-size:13px;font-weight:600}
.li .sp{flex:1;min-width:0}
.ok{color:#1a7f37}[data-theme=dark] .ok{color:#8FE3B5}.bad2{color:#c0392b}[data-theme=dark] .bad2{color:#FFA79B}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:var(--r-nest);font-size:11px;line-height:13px;color:var(--ink-muted);text-align:center;min-width:0}
.tab .tlbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:20px;height:20px;padding:3px;border-radius:999px;box-sizing:content-box}
.tab[aria-current=page]{color:var(--ink);font-weight:600}
.tab[aria-current=page] svg{background:var(--ink);color:var(--bg)}
@media(min-width:900px){.tabbar{display:none}}
/* Ф1: глобальный поиск в шапке (телефон — во всю ширину) */
.gwrap{position:relative;display:flex;flex:0 0 auto;width:340px;min-width:0}
.gsr{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 14px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.gsr:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.gsr input{border:0;background:none;outline:none;width:100%;min-width:0}
.gsr svg{flex:0 0 auto}
.gpanel{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:45;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:0 18px 40px rgba(18,18,18,.22);max-height:min(70vh,480px);overflow:auto;padding:8px;display:none}
.gpanel.on{display:block} .qhint{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--ink-muted);font-size:12px;flex:0 0 auto} .qhint kbd{border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;font:inherit;background:var(--card-solid);color:var(--ink-muted);display:none} @media(min-width:768px){.qhint kbd{display:inline-block}}
.ggrp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:8px 10px 4px}
.git{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-nest);min-height:44px}
.git:hover,.git.cur{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.git .sp{flex:1;min-width:0}
.git b{display:block;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.git .hint{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gempty{padding:18px 12px;text-align:center}
@media(max-width:899px){.tbrow{flex-wrap:wrap}.gwrap{order:9;flex:1 1 100%;width:100%;margin-top:4px}}
/* ==== Ф4: верстка и токены V-1…V-5 ==== */
:root{--line-strong:rgba(18,18,18,.24)}
[data-theme=dark]{--line-strong:rgba(255,255,255,.28)}
.card,.stat,.src,.tblwrap,.lock,.empty{border-color:var(--line-strong)}
.tbl th,.tbl td,.tfoot{border-color:var(--line-strong)}
.side,.rail,.topbar,.tabbar{border-color:var(--line-strong)}
button,.btn,.ib,.nv,.railbtn,.step,.li{min-height:44px}
.ib{min-width:44px}
.ib.sm{width:44px;height:44px}
.ib.sm svg{width:18px;height:18px}
select,.mini,.field input,.field select{min-height:44px}
.btn{padding:10px 16px}
.btn.sm{padding:10px 14px;font-size:13px;line-height:18px}
.tbl th{font-size:12px;line-height:16px}
.tbl td{font-size:14px;line-height:20px}
.tblwrap,.tblscroll{min-width:0;max-width:100%}
.tblscroll{overscroll-behavior-x:contain}
.content{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.toast{bottom:calc(18px + env(safe-area-inset-bottom))}
@media(max-width:899px){body{font-size:16px;line-height:24px}.tbl td{font-size:14px;line-height:20px}}
@media(min-width:1180px){.tbl td{font-size:15px;line-height:22px}.content{padding-bottom:calc(60px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="sheet" class="sheet"></div>
<div class="scrim" id="scrim" data-act="closesheet"></div>
<div class="dlg" id="dlg"></div>
<div class="toast" id="toast"></div>
<div class="undo" id="undo"></div>
<script>
"use strict";
var T={
 app:{name:"Админ-панель",role:{head:"Руководитель",admin:"Администратор",manager:"Менеджер"}},
 nav:{src:"Данные",calc:"Расчёт",comm:"Коммуникации",adm:"Доступ",work:"Рабочее место"},

function row(t,v,r){return '<div class="calcrow"><span class="hint">'+esc(t)+'</span><span class="num">'+esc(v)+' → '+esc(r)+'</span></div>';}
function bindCalc(){
 var u=document.getElementById("cc-usd"); if(!u)return;
 var q=document.getElementById("cc-qty"),c=document.getElementById("cc-cat");
 function up(){
  var usd=parseFloat(String(u.value).replace(",","."))||0, qty=parseFloat(String(q.value).replace(",","."))||0;
  var r=price(usd,c.value,RULES.rate,RULES.extra,RULES.round);
  document.getElementById("cc-unit").textContent=money(r.unit);
  document.getElementById("cc-sum").textContent=T.pr.sum+": "+money(r.unit*qty)+" · "+qty+" × "+money(r.unit);
  document.getElementById("cc-steps").innerHTML=row(T.pr.s1,usd+" × "+num(RULES.rate),money(r.base))
   +(RULES.extra?row(T.pr.s2,RULES.extra+"%",money(r.extraSum)):"")
   +row(T.pr.s3,r.dutyRate+"%",money(r.duty))+row(T.pr.s4,r.markupRate+"%",money(r.mark))
   +row(T.pr.s5,RULES.round==="up10"?T.pr.roundUp:T.pr.roundMath,money(r.unit));
 }
 [u,q,c].forEach(function(e){e.addEventListener("input",up);e.addEventListener("change",up);});
 up();
}

 if(a==="jwho"){state.jWho=el.value;render();return;}

try{var m=/[?&](theme|mock|role)=([^&#]*)/g,q;while((q=m.exec(location.search))){if(q[1]==="theme")state.theme=q[2];if(q[1]==="mock")state.mock=q[2];if(q[1]==="role")state.role=q[2];}}catch(e){}

var KPKEYS=["CATS", "GOODS", "LETTERS", "XLS", "USERS", "JOURNAL", "SRC", "CASES", "RULES", "P"];
var KPFIELDS=["theme", "mock", "role", "plist", "tab", "wizCols"];

/* ---- durable records via URL hash (sandbox-safe) ---- */
var KPG={},KPSEED=null,KPT=null,KPLAST="";
function kpKeys(){return KPKEYS;}
function kpBoot(){
 if(!KPSEED){KPSEED={};kpKeys().forEach(function(k){try{if(window[k]!==undefined)KPSEED[k]=JSON.stringify(window[k]);}catch(e){}});}
 hdbRead();
 if(!HDB)return;
 if(HDB.g)kpKeys().forEach(function(k){if(HDB.g[k]===undefined)return;try{window[k]=JSON.parse(HDB.g[k]);}catch(e){}});
 if(HDB.st)Object.keys(HDB.st).forEach(function(f){try{state[f]=HDB.st[f];}catch(e){}});
}
function kpSave(){
 if(!KPSEED)return;
 var g={};
 kpKeys().forEach(function(k){try{var v=window[k];if(v===undefined)return;var s=JSON.stringify(v);if(s!==KPSEED[k])g[k]=s;}catch(e){}});
 var st={};
 KPFIELDS.forEach(function(f){try{if(state[f]!==undefined)st[f]=state[f];}catch(e){}});
 var body={v:1,g:g,st:st,at:new Date().toISOString()};
 var enc=b64e(body);
 if(enc===KPLAST)return;
 KPLAST=enc;
 HDB=body;
 hdbWrite();
 kpMark();
}
function kpDirty(){
 if(!KPSEED)return false;
 for(var i=0;i<KPKEYS.length;i++){var k=KPKEYS[i];try{var v=window[k];if(v!==undefined&&JSON.stringify(v)!==KPSEED[k])return true;}catch(e){}}
 return false;
}
function kpMark(){
 var t=kpDirty()?"сохранено":"записей "+Object.keys(KPG=(HDB&&HDB.g)||{}).length;
 Array.prototype.forEach.call(document.querySelectorAll("[data-dbstate],[data-dbcount]"),function(e){e.textContent=t;});
}
function kpTick(){clearTimeout(KPT);KPT=setTimeout(function(){try{kpSave();}catch(e){}},250);}
function kpHook(){
 kpTick();
 if(typeof render==="function"){clearTimeout(KPT);KPT=setTimeout(function(){try{kpSave();}catch(e){}},250);}
}
["click","input","change","keyup"].forEach(function(ev){document.addEventListener(ev,kpHook,true);});
window.addEventListener("hashchange",kpTick);
window.addEventListener("pagehide",function(){try{kpSave();}catch(e){}});
try{kpMark();}catch(e){}
/* ---- end durable records ---- */

kpBoot();
render();
</script>

<script data-clero-project-page-live-reload>
(() => {
  const pageId = "1c2b1e4a92becd607f028005";
  const revision = "a8993dad0befc8d06947182facc60d7afe4343f810dfd054ce38f5618c9dbfa8";
  let socket = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;
  let stopped = false;

  const reload = () => window.location.reload();
  const scheduleReconnect = () => {
    if (stopped || reconnectTimer !== null) return;
    reconnectTimer = window.setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };
  const connect = () => {
    if (stopped) return;
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    try {
      socket = new WebSocket(
        `${protocol}//${window.location.host}/ws/project-pages/${encodeURIComponent(pageId)}/`
      );
    } catch (_error) {
      scheduleReconnect();
      return;
    }
    socket.addEventListener("open", () => {
      reconnectDelay = 1000;
    });
    socket.addEventListener("message", (messageEvent) => {
      let message;
      try {
        message = JSON.parse(messageEvent.data);
      } catch (_error) {
        return;
      }
      const data = message && message.data ? message.data : {};
      if (
        message.event === "project.html.connected" &&
        data.body_sha256 &&
        data.body_sha256 !== revision
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.updated" &&
        (!data.body_sha256 || data.body_sha256 !== revision)
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.unpublished" ||
        message.event === "project.html.deleted"
      ) {
        reload();
      }
    });
    socket.addEventListener("close", (closeEvent) => {
      socket = null;
      if (closeEvent.code === 4004) {
        reload();
        return;
      }
      scheduleReconnect();
    });
    socket.addEventListener("error", () => {
      if (socket) socket.close();
    });
  };
  window.addEventListener("pagehide", () => {
    stopped = true;
    if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);
    if (socket) socket.close(1000, "Page closed");
  }, { once: true });
  connect();
})();
</script>
