<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Спецификации, аналитика, рассылки, подключения — Э3 — Автоматизация КП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEBE6;--surface:#F6F5F1;--card:#FFFFFF;--ink:#121212;--ink-muted:#6A6963;--line:rgba(18,18,18,.10);
--yellow:#FFE45C;--sky:#5CC3F7;--sand:#D9CD92;--orchid:#E47EE8;--mint:#9FE3B5;--coral:#FF8A7A;
--r-card:18px;--r-chart:32px;--r-nest:12px;--r-pill:999px;--dur:160ms;--ease:cubic-bezier(.22,.61,.36,1);--side:256px;--rail:66px}
[data-theme=dark]{--bg:#141414;--surface:#1D1D1D;--card:#232323;--ink:#F4F3EF;--ink-muted:#B4B3AC;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Onest,system-ui,sans-serif;font-size:14px;line-height:20px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.hint{font-size:12px;line-height:16px;color:var(--ink-muted);overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:16px;height:16px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 7px;font-size:12px;max-width:210px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.side{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;flex-direction:column;gap:4px;z-index:20;overflow:auto}
.rail{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);padding:14px 8px;flex-direction:column;align-items:center;gap:6px;z-index:20}
.main{margin:0;min-width:0}
@media(min-width:700px){.rail{display:flex}.main{margin-left:var(--rail)}.tabbar{display:none}.content{padding-bottom:40px}}
@media(min-width:1240px){.side{display:flex}.rail{display:none}.main{margin-left:var(--side)}}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding:0 8px}
.brand .mark{width:34px;height:34px;border-radius:999px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.brand b{font-size:14px;font-weight:600;display:block;letter-spacing:-.01em}
.grp{margin-bottom:12px}
.grp>span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:0 10px;margin-bottom:4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-nest);text-align:left}
.nv:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nv[aria-current=page]{background:var(--ink);color:var(--bg);font-weight:600}
.nv .sp{flex:1;min-width:0}
.nv .badge{font-size:11px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.nv[aria-current=page] .badge{background:rgba(255,255,255,.2)}
.nv.dim{opacity:.45}
.railbtn{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.railbtn svg{width:20px;height:20px}
.railbtn[aria-current=page]{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
.tbrow{display:flex;align-items:center;gap:10px;max-width:1680px;margin:0 auto}
.tbtitle{flex:1;min-width:0}
.tbtitle h1{font-size:19px;line-height:25px;font-weight:600;letter-spacing:-.02em}
.content{padding:14px 16px 96px;max-width:1680px;margin:0 auto}
@media(min-width:1240px){.content{padding:18px 24px 60px}}
.ib{width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);flex:0 0 auto;transition:transform var(--dur) var(--ease)}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:15px;height:15px}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,var(--card))}
.ib:active{transform:scale(.95)}
.btn{border-radius:var(--r-pill);padding:9px 16px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform var(--dur) var(--ease)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.wide{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;min-width:0}
@media(min-width:1240px){.card{padding:16px}}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r-chart);padding:16px;min-width:0}
@media(min-width:1240px){.chart{padding:20px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-chart);padding:16px;min-width:0}
.stat.main{background:var(--yellow);border-color:transparent;color:#121212}
.stat .lbl{font-size:12px;line-height:16px;color:var(--ink-muted)}
.stat.main .lbl{color:rgba(18,18,18,.72)}
.stat .big{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.stat .sub{font-size:11px;line-height:15px;color:var(--ink-muted);margin-top:4px}
.stat.main .sub{color:rgba(18,18,18,.72)}
.nest{background:var(--surface);border-radius:var(--r-nest);padding:11px;min-width:0}
.grid{display:grid;gap:12px}
.g2,.g3,.g5{grid-template-columns:1fr}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g5{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1240px){.g5{grid-template-columns:repeat(5,1fr)}}
.bento{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.bento{grid-template-columns:repeat(2,1fr)}.bwide{grid-column:span 2}}
.row{display:flex;align-items:center;gap:8px}
.wrapflex{flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head h2{font-size:15px;line-height:20px;font-weight:600;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 9px;font-size:11px;line-height:15px;font-weight:500;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.c-mint{background:var(--mint);border-color:transparent;color:#121212}
.c-yellow{background:var(--yellow);border-color:transparent;color:#121212}
.c-coral{background:var(--coral);border-color:transparent;color:#121212}
.c-sky{background:var(--sky);border-color:transparent;color:#121212}
.c-sand{background:var(--sand);border-color:transparent;color:#121212}
.c-orchid{background:var(--orchid);border-color:transparent;color:#121212}
.c-neutral{background:var(--surface);color:var(--ink-muted)}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.pill{border-radius:var(--r-pill);padding:7px 13px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--card);white-space:nowrap;flex:0 0 auto}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.step{display:flex;align-items:center;gap:7px;border-radius:var(--r-pill);padding:6px 13px;font-size:12px;border:1px solid var(--line);background:var(--card);white-space:nowrap;flex:0 0 auto}
.step .n{width:19px;height:19px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.step[aria-current=step]{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.step[aria-current=step] .n{background:rgba(255,255,255,.22)}
.step.done{background:var(--mint);border-color:transparent;color:#121212}
.step.done .n{background:rgba(18,18,18,.16)}
.steppills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:660px}
.tbl th{text-align:left;font-size:11px;line-height:15px;font-weight:600;color:var(--ink-muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.gap td{background:color-mix(in srgb,var(--coral) 16%,transparent)}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.bars{display:flex;gap:8px;align-items:flex-end;height:152px}
.bcol{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.bvals{display:flex;justify-content:center;gap:5px;font-size:11px;line-height:15px;font-variant-numeric:tabular-nums}
.bsticks{flex:1;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.bar{width:13px;border-radius:6px 6px 0 0;min-height:3px}
.bar.req{background:var(--ink)}
.bar.q{background:var(--sky)}
.bx{display:flex;gap:8px;margin-top:6px}
.bx span{flex:1;min-width:0;text-align:center;font-size:11px;line-height:15px;color:var(--ink-muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.sw{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.hrow{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;padding:5px 0;min-width:0}
.hrow .hl{font-size:12px;font-weight:500;overflow-wrap:anywhere}
.hrow .tl{display:block;height:10px;border-radius:999px;background:var(--surface);overflow:hidden}
.hrow .tf{display:block;height:100%;border-radius:999px;min-width:3px}
.hrow .hv{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:520px){.hrow{grid-template-columns:88px 1fr auto}.hrow .hv{font-size:11px}}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .ak{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.arow .an{font-size:11px;line-height:15px;color:var(--ink-muted);overflow-wrap:anywhere}
.arow .av{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .sp{flex:1;min-width:0}
.crow b{font-size:13px;font-weight:600;display:block}
.minic{flex:0 0 132px;min-width:0}
.progress{height:8px;border-radius:999px;background:var(--surface);overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;border-radius:999px;background:var(--ink)}
.progress.mint span{background:var(--mint)}
.progress.coral span{background:var(--coral)}
.calcrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 0}
.dlgwrap,.dlg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
.dlgwrap.open{display:flex}
.notiwrap{position:relative;flex:0 0 auto}
.notibadge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:999px;background:#B35A2A;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:600}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:85;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:10px 16px;font-size:13px;display:none;align-items:center;gap:12px}
.undo.on{display:flex}
.undo button{color:var(--yellow);font-weight:600;text-decoration:underline}
.dlgwrap .box{background:var(--card);border-radius:var(--r-card);padding:18px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(18,18,18,.25)}
.dlgwrap h3{font-size:16px;line-height:22px;font-weight:600;margin-bottom:6px}
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.45);z-index:65;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:10px 16px;font-size:13px;max-width:92vw;display:none;text-align:center;z-index:90}
.toast.on{display:block}
.sk{background:linear-gradient(90deg,var(--surface) 25%,color-mix(in srgb,var(--ink) 8%,var(--surface)) 37%,var(--surface) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:var(--r-nest)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.sk.h44{height:44px}.sk.h90{height:90px}.sk.h170{height:170px}
.empty{text-align:center;padding:26px 16px;border-radius:var(--r-card);background:var(--card);border:1px dashed var(--line)}
.empty .ic{width:46px;height:46px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:3px}
.err{border-radius:var(--r-card);background:var(--coral);color:#121212;padding:16px}
.err h3{font-size:15px;font-weight:700;margin-bottom:3px}
.err .btn{margin-top:10px;background:rgba(18,18,18,.86);color:#fff;border-color:transparent}
.lock{max-width:520px;margin:40px auto;text-align:center;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);padding:28px 20px}
.lock .ic{width:58px;height:58px;border-radius:999px;background:var(--yellow);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.lock h2{font-size:20px;line-height:26px;font-weight:700;margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:8px}
.lirow{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:var(--r-nest);padding:11px;background:var(--card);width:100%;text-align:left}
.lirow .sp{flex:1;min-width:0}
.lirow b{font-size:13px;font-weight:600;display:block;overflow-wrap:anywhere}
.lirow[aria-selected=true]{background:var(--yellow);border-color:transparent;color:#121212}
.lirow.gap{border-color:var(--coral)}
.rcp{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rcp:last-child{border-bottom:0}
.rcp .sp{flex:1;min-width:0}
.rcp b{font-size:13px;font-weight:600;display:block;overflow-wrap:anywhere}
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-nest);padding:16px;overflow-x:auto}
.doc h4{font-size:15px;font-weight:700;margin-bottom:4px}
.doc .meta{font-size:12px;line-height:16px;color:var(--ink-muted);margin-bottom:12px}
.doc table{width:100%;border-collapse:collapse;min-width:420px}
.doc th{font-size:11px;color:var(--ink-muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.doc td{font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.doc .tot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:10px}
.sign{display:flex;gap:20px;align-items:flex-end;margin-top:16px;flex-wrap:wrap}
.sign .blk{flex:1;min-width:180px}
.sign .line{border-bottom:1px solid var(--line);padding-bottom:2px;font-size:11px;color:var(--ink-muted);margin-top:4px}
.facs{width:150px;height:64px}
.stamp{width:104px;height:104px;opacity:.85}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.sticky .in{max-width:1680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.sticky .sp{flex:1;min-width:0}
@media(min-width:900px){.sticky{display:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:var(--r-nest);font-size:11px;line-height:13px;color:var(--ink-muted);text-align:center;min-width:0}
.tabbtn .tlbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbtn svg{width:20px;height:20px;padding:3px;border-radius:999px;box-sizing:content-box}
.tabbtn[aria-current=page]{color:var(--ink);font-weight:600}
.tabbtn[aria-current=page] svg{background:var(--ink);color:var(--bg)}
@media(min-width:900px){.tabbar{display:none}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:var(--r-card) var(--r-card) 0 0;padding:16px;max-height:88vh;overflow:auto;transform:translateY(102%);transition:transform var(--dur) var(--ease);box-shadow:0 -16px 40px rgba(18,18,18,.2);max-width:100vw}
.sheet.open{transform:translateY(0)}
@media(min-width:900px){.sheet{left:50%;transform:translate(-50%,102%);width:680px;border-radius:var(--r-card)}.sheet.open{transform:translate(-50%,0)}}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;margin-bottom:4px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-nest);padding:9px 11px;font-size:13px}
.spin{width:16px;height:16px;border-radius:999px;border:2px solid var(--line);border-top-color:var(--ink);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rowsplit{display:grid;gap:12px;grid-template-columns:1fr}
.rowsplit>*{min-width:0}
.stack,.c-a,.c-b{min-width:0}
.doc{max-width:100%}
@media(min-width:1240px){.rowsplit.row-desk{grid-template-columns:1.35fr 1fr}.rowsplit.row-desk.one{grid-template-columns:1fr}}
.actrow{display:none}
@media(min-width:900px){.actrow{display:flex}}
/* Ф1: глобальный поиск в шапке (телефон — во всю ширину) */
.qwrap{position:relative;display:flex;flex:0 0 auto;width:340px;min-width:0}
.hsearch{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 14px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.hsearch:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.hsearch input{border:0;background:none;outline:none;width:100%;min-width:0}
.hsearch svg{flex:0 0 auto}
.qpanel{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:45;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:0 18px 40px rgba(18,18,18,.22);max-height:min(70vh,480px);overflow:auto;padding:8px;display:none}
.qpanel.on{display:block} .qhint{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--ink-muted);font-size:12px;flex:0 0 auto} .qhint kbd{border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;font:inherit;background:var(--card-solid);color:var(--ink-muted);display:none} @media(min-width:768px){.qhint kbd{display:inline-block}}
.qgrp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:8px 10px 4px}

function b64e(o){try{return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}catch(e){return "";}}
function b64d(s){try{return JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/-/g,"+").replace(/_/g,"/")))));}catch(e){return null;}}
function hdbRead(){
 try{
  var m=/[?&#]\.db=([^&]*)/.exec(location.hash||"");
  if(!m){HDB=null;return;}
  HDB=b64d(m[1]);
 }catch(e){HDB=null;}
}
function hdbPath(){
 try{
  var h=(location.hash||"").replace(/^#\/?/,"");
  var i=h.indexOf("?");
  if(i>=0)h=h.slice(0,i);
  return h.split("/").filter(Boolean);
 }catch(e){return [];}
}
function hdbWrite(){
 try{
  if(!HDB)return;
  var s=b64e(HDB);
  var base="#/"+(hdbPath().join("/")||"specs");
  var want=base+"?.db="+s;
  if(location.hash!==want)history.replaceState(null,"",location.pathname+location.search+want);
 }catch(e){}
}
function parseHash(){hdbRead();var p=hdbPath();return p.length?p:["specs"];}
function go(h){
 var t="#/"+String(h).replace(/^\/+/,"");
 if(HDB)t+="?.db="+b64e(HDB);

}

var KPKEYS=["SPECS", "NEWS", "RCPTS", "INTEG", "POSS", "PO_MAIL", "CLIENTMAIL", "P"];
var KPFIELDS=["theme", "mock", "role", "tab", "period", "cfrom", "cto", "news", "wiz"];

/* ---- durable records via URL hash (sandbox-safe) ---- */
var KPG={},KPSEED=null,KPT=null,KPLAST="";
function kpKeys(){return KPKEYS;}
function kpBoot(){
 if(!KPSEED){KPSEED={};kpKeys().forEach(function(k){try{if(window[k]!==undefined)KPSEED[k]=JSON.stringify(window[k]);}catch(e){}});}
 hdbRead();
 if(!HDB)return;
 if(HDB.g)kpKeys().forEach(function(k){if(HDB.g[k]===undefined)return;try{window[k]=JSON.parse(HDB.g[k]);}catch(e){}});
 if(HDB.st)Object.keys(HDB.st).forEach(function(f){try{state[f]=HDB.st[f];}catch(e){}});
}
function kpSave(){
 if(!KPSEED)return;
 var g={};
 kpKeys().forEach(function(k){try{var v=window[k];if(v===undefined)return;var s=JSON.stringify(v);if(s!==KPSEED[k])g[k]=s;}catch(e){}});
 var st={};
 KPFIELDS.forEach(function(f){try{if(state[f]!==undefined)st[f]=state[f];}catch(e){}});
 var body={v:1,g:g,st:st,at:new Date().toISOString()};
 var enc=b64e(body);
 if(enc===KPLAST)return;
 KPLAST=enc;
 HDB=body;
 hdbWrite();
 kpMark();
}
function kpDirty(){
 if(!KPSEED)return false;
 for(var i=0;i<KPKEYS.length;i++){var k=KPKEYS[i];try{var v=window[k];if(v!==undefined&&JSON.stringify(v)!==KPSEED[k])return true;}catch(e){}}
 return false;
}
function kpMark(){
 var t=kpDirty()?"сохранено":"записей "+Object.keys(KPG=(HDB&&HDB.g)||{}).length;
 Array.prototype.forEach.call(document.querySelectorAll("[data-dbstate],[data-dbcount]"),function(e){e.textContent=t;});
}
function kpTick(){clearTimeout(KPT);KPT=setTimeout(function(){try{kpSave();}catch(e){}},250);}
function kpHook(){
 kpTick();
 if(typeof render==="function"){clearTimeout(KPT);KPT=setTimeout(function(){try{kpSave();}catch(e){}},250);}
}
["click","input","change","keyup"].forEach(function(ev){document.addEventListener(ev,kpHook,true);});
window.addEventListener("hashchange",kpTick);
window.addEventListener("pagehide",function(){try{kpSave();}catch(e){}});
try{kpMark();}catch(e){}
/* ---- end durable records ---- */

function visible(el){return !!el&&getComputedStyle(el).display!=='none';}
function inScroll(el){
 var p=el.parentNode;
 while(p&&p!==document.body&&p.nodeType===1){
  var ox=getComputedStyle(p).overflowX;
  if(ox==='auto'||ox==='scroll'||ox==='hidden')return true;
  p=p.parentNode;
 }
 return false;
}
function measure(tag,res){
 var doc=document.documentElement,i,j,bad=0,docW=document.body.clientWidth||doc.clientWidth;
 var cul=[],all=document.querySelectorAll('body *');
 for(i=0;i<all.length;i++){var rr2=all[i].getBoundingClientRect();if(rr2.width<2)continue;if(inScroll(all[i]))continue;if(rr2.right>docW+1.5)cul.push((all[i].className&&typeof all[i].className==='string'?all[i].className.split(' ')[0]:all[i].tagName)+'@'+Math.round(rr2.right));}
 if(cul.length){bad++;res.push(tag+' FAIL: за границу выходят '+cul.slice(0,6).join(', '));}
 else{res.push(tag+' ok: контент в границах экрана (документ '+doc.scrollWidth+', экран '+docW+')');}
 var els=document.querySelectorAll('#view .card,.chart,.stat,.nest,.lirow,.doc,.tblwrap,.progress,.bars');
 var clip=0,out=0;
 for(i=0;i<els.length;i++){var e=els[i],r=e.getBoundingClientRect();
  if(r.width<1)continue;
  if(e.scrollWidth-e.clientWidth>2&&getComputedStyle(e).overflowX==='hidden')clip++;
  if((r.right>docW+1.5||r.left<-1.5)&&!inScroll(e))out++;}
 if(clip){bad++;res.push(tag+' FAIL: обрезанный текст в '+clip+' контейнерах');}else{res.push(tag+' ok: обрезанного текста нет');}
 if(out){bad++;res.push(tag+' FAIL: '+out+' блоков выходят за ширину экрана');}else{res.push(tag+' ok: блоки в границах экрана');}
 var cards=document.querySelectorAll('#view .card,.stat,.chart');
 var coll=0;
 for(i=0;i<cards.length;i++)for(j=i+1;j<cards.length;j++){
  var a=cards[i].getBoundingClientRect(),b=cards[j].getBoundingClientRect();
  if(a.width<2||b.width<2)continue;
  if(a.left<b.right-2&&b.left<a.right-2&&a.top<b.bottom-2&&b.top<a.bottom-2)coll++;}
 if(coll){bad++;res.push(tag+' FAIL: наложений карточек '+coll);}else{res.push(tag+' ok: наложений карточек нет');}
 var bs=document.querySelectorAll('#view button');var tiny=0;
 for(i=0;i<bs.length;i++){var rr=bs[i].getBoundingClientRect();if(rr.width>0&&rr.height>0&&rr.height<24)tiny++;}
 if(tiny){bad++;res.push(tag+' FAIL: кнопок ниже 24 px: '+tiny);}else{res.push(tag+' ok: видимые кнопки не ниже 24 px');}
 var t=document.getElementById('scr-title');
 if(!t||t.textContent.length<3){bad++;res.push(tag+' FAIL: заголовок экрана пуст');}
 return bad;
}

<script data-clero-project-page-live-reload>
(() => {
  const pageId = "3a519c2a3aba304ad15a20cc";
  const revision = "6c13d7e8276e69b328949ca77d9c59dd7c8ba076ca3e856b0ab8564aef5c7b1c";
  let socket = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;
  let stopped = false;

  const reload = () => window.location.reload();
  const scheduleReconnect = () => {
    if (stopped || reconnectTimer !== null) return;
    reconnectTimer = window.setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };
  const connect = () => {
    if (stopped) return;
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    try {
      socket = new WebSocket(
        `${protocol}//${window.location.host}/ws/project-pages/${encodeURIComponent(pageId)}/`
      );
    } catch (_error) {
      scheduleReconnect();
      return;
    }
    socket.addEventListener("open", () => {
      reconnectDelay = 1000;
    });
    socket.addEventListener("message", (messageEvent) => {
      let message;
      try {
        message = JSON.parse(messageEvent.data);
      } catch (_error) {
        return;
      }
      const data = message && message.data ? message.data : {};
      if (
        message.event === "project.html.connected" &&
        data.body_sha256 &&
        data.body_sha256 !== revision
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.updated" &&
        (!data.body_sha256 || data.body_sha256 !== revision)
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.unpublished" ||
        message.event === "project.html.deleted"
      ) {
        reload();
      }
    });
    socket.addEventListener("close", (closeEvent) => {
      socket = null;
      if (closeEvent.code === 4004) {
        reload();
        return;
      }
      scheduleReconnect();
    });
    socket.addEventListener("error", () => {
      if (socket) socket.close();
    });
  };
  window.addEventListener("pagehide", () => {
    stopped = true;
    if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);
    if (socket) socket.close(1000, "Page closed");
  }, { once: true });
  connect();
})();
</script>
