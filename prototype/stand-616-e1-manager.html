<head>

<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEBE6;--surface:#F6F5F1;--card:rgba(255,255,255,.72);--card-solid:#fff;--ink:#121212;--ink-muted:#6A6963;--line:rgba(18,18,18,.08);--yellow:#FFE45C;--sky:#5CC3F7;--sand:#D9CD92;--orchid:#E47EE8;--mint:#9FE3B5;--coral:#FF8A7A;--r-card:32px;--r-nest:24px;--r-pill:999px;--blur:16px;--dur:200ms;--ease:cubic-bezier(.22,.61,.36,1);--tabh:74px;--side:264px;--rail:76px}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.hint{font-size:12px;line-height:16px;color:var(--ink-muted);overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.side{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;flex-direction:column;gap:6px;z-index:20}
.rail{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);padding:18px 10px;flex-direction:column;align-items:center;gap:8px;z-index:20}
.main{margin:0}

.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(var(--blur));border-top:1px solid var(--line);z-index:30}

.nv:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nv[aria-current=page]{background:var(--ink);color:var(--bg);font-weight:600}
.nv svg{width:20px;height:20px;flex:0 0 auto}
.nv .sp{flex:1}
.soon{font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-muted)}
.nv[aria-current=page] .soon{color:var(--bg);border-color:transparent;background:rgba(255,255,255,.2)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.railbtn{width:48px;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.railbtn svg{width:22px;height:22px}

.railbtn[aria-current=page]{background:var(--ink);color:var(--bg)}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--line);padding:10px 16px}

svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{border-radius:var(--r-pill);padding:12px 22px;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--card-solid);transition:transform var(--dur) var(--ease)}

:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.content{padding:16px 16px calc(var(--tabh) + 120px);max-width:1440px;margin:0 auto}
@media(min-width:768px){.content{padding:22px 24px 140px}}
@media(min-width:1024px){.content{padding:24px 32px 120px}}
.cols{display:flex;flex-direction:column;gap:18px}
@media(min-width:1024px){.cols.split{flex-direction:row;align-items:flex-start}.cols.split>.col-a{flex:1;min-width:0}.cols.split>.col-b{width:360px;flex:0 0 auto;position:sticky;top:88px}.zones{display:flex;gap:18px;align-items:flex-start}.zones>.z-mail{width:34%;min-width:0}.zones>.z-pos{flex:1;min-width:0}.zones>.z-act{width:320px;flex:0 0 auto}}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}

.card-head h2{font-size:17px;line-height:22px;font-weight:500;flex:1}
.stat{background:var(--card);backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px}
.accent{border:0;border-radius:var(--r-card);padding:16px 18px;color:#121212}
.a-yellow{background:var(--yellow)}.a-sky{background:var(--sky)}.a-sand{background:var(--sand)}.a-orchid{background:var(--orchid)}.a-mint{background:var(--mint)}.a-coral{background:var(--coral)}
.stat .big,.accent .big{font-size:30px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.stat .lbl{font-size:12px;line-height:16px;color:var(--ink-muted);margin-top:2px}
.accent .lbl{color:rgba(18,18,18,.72)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}

.c-yellow{background:var(--yellow);border-color:transparent;color:#121212}.c-sky{background:var(--sky);border-color:transparent;color:#121212}.c-sand{background:var(--sand);border-color:transparent;color:#121212}.c-orchid{background:var(--orchid);border-color:transparent;color:#121212}.c-mint{background:var(--mint);border-color:transparent;color:#121212}.c-coral{background:var(--coral);border-color:transparent;color:#121212}.c-neutral{background:var(--surface);color:var(--ink-muted)}

.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.spread{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse}

.tli{display:flex;gap:12px;align-items:flex-start;position:relative}

.tli .bd .amt{font-size:18px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ev-yellow{background:var(--yellow);color:#121212}.ev-sky{background:var(--sky);color:#121212}.ev-sand{background:var(--sand);color:#121212}.ev-orchid{background:var(--orchid);color:#121212}.ev-mint{background:var(--mint);color:#121212}.ev-coral{background:var(--coral);color:#121212}
.dockwrap{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;pointer-events:none;z-index:25}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card-solid);border-radius:var(--r-card) var(--r-card) 0 0;padding:20px;max-height:86vh;overflow:auto;transform:translateY(102%);transition:transform var(--dur) var(--ease);box-shadow:0 -20px 50px rgba(18,18,18,.18)}

.sticky{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));padding:10px 16px;background:linear-gradient(to top,var(--bg) 62%,transparent);z-index:24}
@media(min-width:768px){.sticky{display:none}}

.toast.on{display:block}
.notiwrap{position:relative;flex:0 0 auto}

.dlgbox{width:100%;max-width:420px;background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r-nest);padding:20px;box-shadow:0 24px 60px rgba(18,18,18,.3)}

@media(min-width:768px){.toast{bottom:26px}}
.sk{background:linear-gradient(90deg,var(--surface) 25%,color-mix(in srgb,var(--ink) 9%,var(--surface)) 37%,var(--surface) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:var(--r-nest)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.sk.h60{height:60px}.sk.h120{height:120px}

/* Ф1: глобальный поиск в шапке (виден на всех ширинах, на телефоне — во всю ширину) */
.qwrap{position:relative;display:flex;flex:0 0 auto;width:380px;min-width:0}

.qpanel.on{display:block} .qhint{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--ink-muted);font-size:12px;flex:0 0 auto} .qhint kbd{border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;font:inherit;background:var(--card-solid);color:var(--ink-muted);display:none} @media(min-width:768px){.qhint kbd{display:inline-block}}

/* ==== Ф4: верстка и токены V-1…V-5 ==== */
:root{--line-strong:rgba(18,18,18,.24)}

}

function titleFor(){
 var p=state.route,k=p[0];
 if(k==="today")return [T.today.hi.replace("{name}",T.app.user.split(" ")[0]),T.today.sub.replace("{date}","22 сентября, вторник").replace("{n}",REQS.filter(function(r2){return lowCount(r2)>0||r2.status==="check";}).length)];
 if(k==="requests"&&p.length>=2)return [T.request.title.replace("{n}",(findReq(p[1])||{num:p[1]}).num),"Запрос на моках"];
 if(k==="requests")return [T.requests.title,T.requests.sub];
 if(p.length>=3&&p[2]==="quote")return [T.quote.title.replace("{n}",(findReq(p[1])||{num:p[1]}).num),"Предпросмотр КП"];
 if(k==="clients"&&p.length>=2){var c=findClient(p[1]);return [c?c.name:"Клиент",T.clients.card];}
 if(k==="clients")return [T.clients.title,T.clients.sub];

}
function render(){
 var r=document.getElementById("root");
 if(!r.dataset.built){r.innerHTML=shell();r.dataset.built="1";}
 var old=document.querySelector(".sticky");if(old)old.remove();
 var ttl=titleFor();setHead(ttl[0],ttl[1]);
 if(state.mock!=="data"){
  var lab=state.route[0]==="today"?T.today.done:T.common.empty,sub=state.route[0]==="today"?T.today.doneSub:"По этому фильтру запросов нет";
  document.getElementById("view").innerHTML=stateBlock(state.mock,lab,sub);
  renderDock("");renderTabs();applyBreakpoints();syncNav();return;
 }
 var p=state.route,k=p[0];
 if(k==="login")vLogin();
 else if(p.length>=3&&p[2]==="quote")vQuote();
 else if(k==="requests"&&p.length>=2)vRequest();
 else if(k==="requests")vRequests();
 else if(k==="clients"&&p.length>=2)vClient();
 else if(k==="clients")vClients();
 else if(k==="today")vToday();
 else if(k==="admin/pricing")vPricing();
 else vPlaceholder();
 renderTabs();applyBreakpoints();syncNav();
}
function syncNav(){
 var cur=state.route.join("/");
 document.querySelectorAll("[data-act=go]").forEach(function(b){
  var k=b.dataset.k;if(!k)return;
  if(k===cur||cur.indexOf(k+"/")===0)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
 });
}

function notiList(){
 var out=[];REQS.forEach(function(r){
  if(r.status==="supAns")out.push({k:"sup",t:"Ответ поставщика получен",s:r.num+" · "+(findClient(r.clientId)||{}).name,h:"#/requests/"+r.id});
  if(r.status==="overdue")out.push({k:"late",t:"Просрочен срок",s:r.num+" · ждёт действия",h:"#/requests/"+r.id});
  if(r.status==="sup")out.push({k:"sync",t:"Ошибка синхронизации прайса",s:"Яндекс Диск · проверьте доступ",h:"#/admin/pricelists"});
  if(r.status==="art")out.push({k:"art",t:"Нужен артикул",s:r.num+" · запросить у клиента",h:"#/requests/"+r.id});
 });
 if(!out.length)out.push({k:"ok",t:"Новых уведомлений нет",s:"Всё обработано",h:"#/today"});
 return out.slice(0,8);
}

 if(e.key==="Escape"){if(document.getElementById("dlgwrap")&&document.getElementById("dlgwrap").classList.contains("on")){dlgClose();return;}if(NOTIOPEN){NOTIOPEN=false;notiPaint();return;}if(QOPEN){qHide();if(typing&&t.blur)t.blur();}return;}
 if(!QOPEN||(t&&t.id!=="q"))return;
 if(e.key==="ArrowDown"){e.preventDefault();if(QRES.length){QSEL=(QSEL+1)%QRES.length;qPaint();}}

<script data-clero-project-page-live-reload>
(() => {
  const pageId = "1a0c2ca7e196d4692ad4a19f";
  const revision = "78150a6e064232b930ac890e4455f1f2e897cad3b9a86010af1840ac027dff6a";
  let socket = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;
  let stopped = false;

  const reload = () => window.location.reload();
  const scheduleReconnect = () => {
    if (stopped || reconnectTimer !== null) return;
    reconnectTimer = window.setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };
  const connect = () => {
    if (stopped) return;
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    try {
      socket = new WebSocket(
        `${protocol}//${window.location.host}/ws/project-pages/${encodeURIComponent(pageId)}/`
      );
    } catch (_error) {
      scheduleReconnect();
      return;
    }
    socket.addEventListener("open", () => {
      reconnectDelay = 1000;
    });
    socket.addEventListener("message", (messageEvent) => {
      let message;
      try {
        message = JSON.parse(messageEvent.data);
      } catch (_error) {
        return;
      }
      const data = message && message.data ? message.data : {};
      if (
        message.event === "project.html.connected" &&
        data.body_sha256 &&
        data.body_sha256 !== revision
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.updated" &&
        (!data.body_sha256 || data.body_sha256 !== revision)
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.unpublished" ||
        message.event === "project.html.deleted"
      ) {
        reload();
      }
    });
    socket.addEventListener("close", (closeEvent) => {
      socket = null;
      if (closeEvent.code === 4004) {
        reload();
        return;
      }
      scheduleReconnect();
    });
    socket.addEventListener("error", () => {
      if (socket) socket.close();
    });
  };
  window.addEventListener("pagehide", () => {
    stopped = true;
    if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);
    if (socket) socket.close(1000, "Page closed");
  }, { once: true });
  connect();
})();
</script>
