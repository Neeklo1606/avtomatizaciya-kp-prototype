<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Поставщики, воронка, календарь — Э2 — Автоматизация КП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEBE6;--surface:#F6F5F1;--card:#FFFFFF;--ink:#121212;--ink-muted:#6A6963;--line:rgba(18,18,18,.10);
--yellow:#FFE45C;--sky:#5CC3F7;--sand:#D9CD92;--orchid:#E47EE8;--mint:#9FE3B5;--coral:#FF8A7A;
--r-card:18px;--on-accent:#121212;--r-nest:12px;--r-pill:999px;--dur:160ms;--ease:cubic-bezier(.22,.61,.36,1);--side:250px;--rail:66px}
[data-theme=dark]{--bg:#141414;--surface:#1D1D1D;--card:#232323;--ink:#F4F3EF;--ink-muted:#B4B3AC;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Onest,system-ui,sans-serif;font-size:14px;line-height:20px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.hint{font-size:12px;line-height:16px;color:var(--ink-muted);overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:16px;height:16px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 7px;font-size:12px;max-width:200px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.side{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;flex-direction:column;gap:4px;z-index:20;overflow:auto}
.rail{display:none;position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);padding:14px 8px;flex-direction:column;align-items:center;gap:6px;z-index:20}
.main{margin:0;min-width:0}
@media(min-width:700px){.rail{display:flex}.main{margin-left:var(--rail)}.tabbar{display:none}.content{padding-bottom:40px}}
@media(min-width:900px){.rail{display:flex}.main{margin-left:var(--rail)}}
@media(min-width:1180px){.side{display:flex}.rail{display:none}.main{margin-left:var(--side)}}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding:0 8px}
.brand .mark{width:34px;height:34px;border-radius:999px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.brand b{font-size:14px;font-weight:600;display:block;letter-spacing:-.01em}
.grp{margin-bottom:12px}
.grp>span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:0 10px;margin-bottom:4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-nest);text-align:left}
.nv:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nv[aria-current=page]{background:var(--ink);color:var(--bg);font-weight:600}
.nv .sp{flex:1;min-width:0}
.nv .badge{font-size:11px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.nv[aria-current=page] .badge{background:rgba(255,255,255,.2)}
.railbtn{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.railbtn svg{width:20px;height:20px}
.railbtn[aria-current=page]{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
.tbrow{display:flex;align-items:center;gap:10px;max-width:1600px;margin:0 auto}
.tbtitle{flex:1;min-width:0}
.tbtitle h1{font-size:19px;line-height:25px;font-weight:600;letter-spacing:-.02em}
.content{padding:14px 16px 96px;max-width:1600px;margin:0 auto}
@media(min-width:1180px){.content{padding:18px 24px 60px}}
.ib{width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);flex:0 0 auto;transition:transform var(--dur) var(--ease)}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:15px;height:15px}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,var(--card))}
.ib:active{transform:scale(.95)}
.btn{border-radius:var(--r-pill);padding:9px 16px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform var(--dur) var(--ease)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.wide{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;min-width:0}
@media(min-width:1180px){.card{padding:16px}}
.ycard{background:var(--yellow);color:#121212;border-radius:var(--r-card);padding:14px}
.nest{background:var(--surface);border-radius:var(--r-nest);padding:11px;min-width:0}
.grid{display:grid;gap:10px}
.g2,.g3,.g4{grid-template-columns:1fr}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1180px){.g4{grid-template-columns:repeat(4,1fr)}}
.rowsplit{display:flex;gap:12px;align-items:stretch;flex-direction:column}
.rowsplit>*{min-width:0}
@media(min-width:1180px){.rowsplit.row-desk{flex-direction:row}.rowsplit.row-desk>.c-a{flex:1;min-width:0}.rowsplit.row-desk>.c-b{width:420px;flex:0 0 auto}}
.row{display:flex;align-items:center;gap:8px}
.wrapflex{flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head h2{font-size:15px;line-height:20px;font-weight:600;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 9px;font-size:11px;line-height:15px;font-weight:500;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.c-mint{background:var(--mint);border-color:transparent;color:#121212}
.c-yellow{background:var(--yellow);border-color:transparent;color:#121212}
.c-coral{background:var(--coral);border-color:transparent;color:#121212}
.c-sky{background:var(--sky);border-color:transparent;color:#121212}
.c-sand{background:var(--sand);border-color:transparent;color:#121212}
.c-orchid{background:var(--orchid);border-color:transparent;color:#121212}
.c-neutral{background:var(--surface);color:var(--ink-muted)}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;font-size:11px;line-height:15px;font-weight:600;color:var(--ink-muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.avatars{display:flex;align-items:center}
.av{width:26px;height:26px;border-radius:999px;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#121212;margin-left:-8px;flex:0 0 auto}
.av:first-child{margin-left:0}
.av.orchid{background:var(--orchid)}.av.sky{background:var(--sky)}.av.mint{background:var(--mint)}.av.sand{background:var(--sand)}
.av.lg{width:44px;height:44px;font-size:14px;border:0;margin:0}
.avatarstack .more{font-size:11px;color:var(--ink-muted);margin-left:6px}
.fcard{border-radius:var(--r-card);padding:13px;border:1px solid var(--line);background:var(--card);min-width:0}
.fcard.sky{background:var(--sky);border-color:transparent;color:#121212}
.fcard.yellow{background:var(--yellow);border-color:transparent;color:#121212}
.fcard.orchid{background:var(--orchid);border-color:transparent;color:#121212}
.fcard.coral{background:var(--coral);border-color:transparent;color:#121212}
.fcard.mint{background:var(--mint);border-color:transparent;color:#121212}
.fcard.sand{background:var(--sand);border-color:transparent;color:#121212}
.fcard .sum{font-size:22px;line-height:26px;font-weight:700;letter-spacing:-.02em}
.fcard .meta{font-size:12px;line-height:16px;opacity:.78}
.fcard .client{font-size:15px;font-weight:600;line-height:20px}
.feed{display:flex;flex-direction:column;gap:10px}
.kboard{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kcol{width:280px;flex:0 0 auto;background:var(--surface);border-radius:var(--r-card);padding:10px;min-width:0}
.kcol.over{outline:2px dashed var(--ink);outline-offset:-4px}
.kcol h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kcol h3 .cnt{font-size:11px;color:var(--ink-muted);font-weight:500}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-nest);padding:11px;margin-bottom:8px;cursor:grab}
.kcard.dragging{opacity:.5}
.kcard .client{font-size:13px;font-weight:600}
.kcard .sum{font-size:15px;font-weight:700;margin-top:2px}
.kcard .foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.kcard .od{font-size:11px;font-weight:600;background:var(--coral);color:#121212;border-radius:999px;padding:2px 8px}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.pill{border-radius:var(--r-pill);padding:7px 13px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--card);white-space:nowrap;flex:0 0 auto}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.calhead span{text-align:center;font-size:11px;color:var(--on-accent);font-weight:600}
.calcell{min-height:52px;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.calcell.out{opacity:.4}
.calcell.today{outline:2px solid var(--ink);outline-offset:-2px}
.calcell .d{font-size:12px;font-weight:600;color:var(--ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:999px}
.dot.orchid{background:var(--orchid)}.dot.sky{background:var(--sky)}.dot.coral{background:var(--coral)}
@media(min-width:700px){.calcell{min-height:86px}.calcell .d{font-size:13px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:var(--r-card) var(--r-card) 0 0;padding:16px;max-height:88vh;overflow:auto;transform:translateY(102%);transition:transform var(--dur) var(--ease);box-shadow:0 -16px 40px rgba(18,18,18,.2);max-width:100vw}
.sheet.open{transform:translateY(0)}
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
@media(min-width:900px){.sheet{left:50%;transform:translate(-50%,102%);width:660px;border-radius:var(--r-card)}.sheet.open{transform:translate(-50%,0)}}
.dlg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
.dlg.open{display:flex}
.notiwrap{position:relative;flex:0 0 auto}
.notibadge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:999px;background:#B35A2A;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:600}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:85;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:10px 16px;font-size:13px;display:none;align-items:center;gap:12px}
.undo.on{display:flex}
.undo button{color:var(--yellow);font-weight:600;text-decoration:underline}
.dlg .box{background:var(--card);border-radius:var(--r-card);padding:18px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(18,18,18,.25)}
.dlg h3{font-size:16px;line-height:22px;font-weight:600;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:10px 16px;font-size:13px;max-width:92vw;display:none;text-align:center;z-index:80}
.toast.on{display:block}
.sk{background:linear-gradient(90deg,var(--surface) 25%,color-mix(in srgb,var(--ink) 8%,var(--surface)) 37%,var(--surface) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:var(--r-nest)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.sk.h44{height:44px}.sk.h80{height:80px}.sk.h160{height:160px}
.empty{text-align:center;padding:26px 16px;border-radius:var(--r-card);background:var(--card);border:1px dashed var(--line)}
.empty .ic{width:46px;height:46px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:3px}
.err{border-radius:var(--r-card);background:var(--coral);color:#121212;padding:16px}
.err h3{font-size:15px;font-weight:700;margin-bottom:3px}
.err .btn{margin-top:10px;background:rgba(18,18,18,.86);color:#fff;border-color:transparent}
.lock{max-width:520px;margin:40px auto;text-align:center;border-radius:var(--r-card);background:var(--card);border:1px solid var(--line);padding:28px 20px}
.lock .ic{width:58px;height:58px;border-radius:999px;background:var(--yellow);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.lock h2{font-size:20px;line-height:26px;font-weight:700;margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border-radius:var(--r-pill);padding:7px 14px;font-size:13px;border:1px solid var(--line);background:var(--card)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.tl{display:flex;flex-direction:column;gap:8px;position:relative}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{display:flex;gap:10px;align-items:flex-start;position:relative}
.tli .pin{width:22px;height:22px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto;z-index:1}
.tli .bd{flex:1;background:var(--surface);border-radius:var(--r-nest);padding:9px 11px;min-width:0}
.tli .bd b{font-size:13px;font-weight:600;display:block}
.calcrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.calcrow:last-child{border-bottom:0;font-weight:700}
.mailprev{background:var(--surface);border-radius:var(--r-nest);padding:12px;white-space:pre-wrap;font-size:13px;line-height:20px}
.list{display:flex;flex-direction:column;gap:8px}
.lirow{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:var(--r-nest);padding:11px;background:var(--card);width:100%;text-align:left}
.lirow.gap{border-color:var(--coral)}
.lirow .sp{flex:1;min-width:0}
.lirow b{font-size:13px;font-weight:600;display:block;overflow-wrap:anywhere}
.lirow[aria-selected=true]{background:var(--yellow);border-color:transparent;color:#121212}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.sticky .in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.sticky .sp{flex:1;min-width:0}
@media(min-width:900px){.sticky{display:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:var(--r-nest);font-size:11px;line-height:13px;color:var(--ink-muted);text-align:center;min-width:0}
.tabbtn .tlbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbtn svg{width:20px;height:20px;padding:3px;border-radius:999px;box-sizing:content-box}
.tabbtn[aria-current=page]{color:var(--ink);font-weight:600}
.tabbtn[aria-current=page] svg{background:var(--ink);color:var(--bg)}
@media(min-width:900px){.tabbar{display:none}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:13px;min-width:0}
.stat .big{font-size:24px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.stat .lbl{font-size:12px;color:var(--ink-muted);margin-top:2px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.sgrid{grid-template-columns:repeat(4,1fr)}}
/* Ф1: глобальный поиск в шапке (телефон — во всю ширину) */
.qwrap{position:relative;display:flex;flex:0 0 auto;width:340px;min-width:0}
.hsearch{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 14px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.hsearch:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.hsearch input{border:0;background:none;outline:none;width:100%;min-width:0}
.hsearch svg{flex:0 0 auto}
.qpanel{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:45;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:0 18px 40px rgba(18,18,18,.22);max-height:min(70vh,480px);overflow:auto;padding:8px;display:none}
.qpanel.on{display:block} .qhint{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--ink-muted);font-size:12px;flex:0 0 auto} .qhint kbd{border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;font:inherit;background:var(--card-solid);color:var(--ink-muted);display:none} @media(min-width:768px){.qhint kbd{display:inline-block}}
.qgrp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:8px 10px 4px}
.qit{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-nest);min-height:44px}
.qit:hover,.qit.cur{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.qit .sp{flex:1;min-width:0}
.qit b{display:block;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qit .hint{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qempty{padding:18px 12px;text-align:center}
@media(max-width:899px){.tbrow{flex-wrap:wrap}.qwrap{order:9;flex:1 1 100%;width:100%;margin-top:4px}}
/* ==== Ф4: верстка и токены V-1…V-5 ==== */
:root{--line-strong:rgba(18,18,18,.24)}
[data-theme=dark]{--line-strong:rgba(255,255,255,.28)}
.card,.chart,.stat,.fcard,.nest,.tblwrap,.lock,.empty,.kcard,.calcell{border-color:var(--line-strong)}
.tbl th,.tbl td,.tfoot,.lirow,.calcrow{border-color:var(--line-strong)}

<script data-clero-project-page-live-reload>
(() => {
  const pageId = "b03ad3d2af4dc096d452502e";
  const revision = "20b59832f223edac8909c0f9c2b3d85c23e6fba22d5ae25b48d889fad28d1fd7";
  let socket = null;
  let reconnectTimer = null;
  let reconnectDelay = 1000;
  let stopped = false;

  const reload = () => window.location.reload();
  const scheduleReconnect = () => {
    if (stopped || reconnectTimer !== null) return;
    reconnectTimer = window.setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };
  const connect = () => {
    if (stopped) return;
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    try {
      socket = new WebSocket(
        `${protocol}//${window.location.host}/ws/project-pages/${encodeURIComponent(pageId)}/`
      );
    } catch (_error) {
      scheduleReconnect();
      return;
    }
    socket.addEventListener("open", () => {
      reconnectDelay = 1000;
    });
    socket.addEventListener("message", (messageEvent) => {
      let message;
      try {
        message = JSON.parse(messageEvent.data);
      } catch (_error) {
        return;
      }
      const data = message && message.data ? message.data : {};
      if (
        message.event === "project.html.connected" &&
        data.body_sha256 &&
        data.body_sha256 !== revision
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.updated" &&
        (!data.body_sha256 || data.body_sha256 !== revision)
      ) {
        reload();
        return;
      }
      if (
        message.event === "project.html.unpublished" ||
        message.event === "project.html.deleted"
      ) {
        reload();
      }
    });
    socket.addEventListener("close", (closeEvent) => {
      socket = null;
      if (closeEvent.code === 4004) {
        reload();
        return;
      }
      scheduleReconnect();
    });
    socket.addEventListener("error", () => {
      if (socket) socket.close();
    });
  };
  window.addEventListener("pagehide", () => {
    stopped = true;
    if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);
    if (socket) socket.close(1000, "Page closed");
  }, { once: true });
  connect();
})();
</script>
