<script>
(async function(){
  function b64bytes(s){var b=atob(s),n=b.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=b.charCodeAt(i);return u;}
  async function inflate(s){
    var bytes=b64bytes(s);
    var st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(st).text();
  }
  try{
    var css=await inflate(document.getElementById('payload-css').textContent.trim());
    var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
    var js=await inflate(document.getElementById('payload-js').textContent.trim());
    var sc=document.createElement('script'); sc.textContent=js; document.body.appendChild(sc);
    var boot=document.getElementById('boot'); if(boot) boot.remove();
    var app=document.getElementById('app');
    if(app && /Загружаю/.test(document.body.innerText)){ throw new Error('app did not render'); }
  }catch(e){
    document.getElementById('boot').innerHTML='<div><b>Не удалось загрузить прототип</b><span>'+String(e.message||e)+'</span></div>';
    console.error(e);
  }
})();
</script>
